<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Adify - Earn Money</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <h2 id="welcome">Welcome</h2>

    <div class="card">
      <h3>💰 Balance</h3>
      <p id="balance">$0.0000</p>
      <small>Minimum withdraw: $0.05</small>
    </div>

    <div class="card">
      <h3>🎯 Watch Ads</h3>
      <button id="watchBtn">▶ Watch Ad</button>
      <p>Ads Seen: <span id="adsSeen">0</span> / 250</p>
      <p>$0.0002 per ad</p>
    </div>

    <div class="card">
      <h3>👥 Referral (20% lifetime)</h3>
      <input id="refLink" readonly />
      <button onclick="copyRef()">Copy Referral Link</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>

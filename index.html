<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Adify</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="welcome">Welcome</h2>

<div class="card">
  <h3>💰 Balance</h3>
  <h1 id="balance">$0.0000</h1>
  <p>Minimum withdraw: $0.05</p>
</div>

<div class="card">
  <h3>🎯 Watch Ads</h3>
  <button id="watchBtn" onclick="watchAd()">▶ Watch Ad</button>
  <p>Ads Seen: <span id="adsSeen">0</span> / 250</p>
  <p>$0.0002 per ad</p>
</div>

<div class="card">
  <h3>💸 Withdraw (USDT BEP20)</h3>
  <input id="wallet" placeholder="Enter USDT BEP20 address">
  <button onclick="withdraw()">Request Withdraw</button>
</div>

<div class="card">
  <h3>👥 Referral (20% lifetime)</h3>
  <input id="ref" readonly>
  <button onclick="copyRef()">Copy Referral Link</button>
</div>

<script src="main.js"></script>
</body>
</html>
